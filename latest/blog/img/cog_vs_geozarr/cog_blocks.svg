<text x="210.8" y="393.7" class="xs" text-anchor="middle">full resolution: 11 × 11 blocks of 1024×1024 (to scale)</text>
<line x1="222.6" y1="192.4" x2="440.0" y2="140.0" class="dash"/>
<text x="450.0" y="106.0" class="b" text-anchor="start">z12 tile — footprint ~743 px</text>
<text x="450.0" y="124.0" class="s" text-anchor="start">→ 2 × 2 blocks: 4 ranges, all fetched in parallel (1 round trip)</text>
<text x="450.0" y="148.0" class="mono" text-anchor="start">GET bytes=31709542-32104336   394,795 B   block (4,4)</text>
<text x="450.0" y="166.0" class="mono" text-anchor="start">GET bytes=32104337-32505212   400,876 B   block (4,5)</text>
<text x="450.0" y="184.0" class="monos" text-anchor="start">…  2 more ranges for row 5</text>
<line x1="211.7" y1="211.3" x2="440.0" y2="290.0" class="dash"/>
<text x="450.0" y="282.0" class="b" text-anchor="start">z14 tile — footprint ~186 px</text>
<text x="450.0" y="300.0" class="s" text-anchor="start">→ 1 whole 1024² block = 1.57 MB</text>
<text x="450.0" y="318.0" class="s" text-anchor="start">the tile uses ~3% of the bytes it downloads</text>
<rect x="450.0" y="345.0" width="16.0" height="12.0" rx="0" class="cogO"></rect>
<text x="472.0" y="355.0" class="s" text-anchor="start">block fetched</text>
<rect x="570.0" y="345.0" width="16.0" height="12.0" rx="0" class="fpc"></rect>
<text x="592.0" y="355.0" class="s" text-anchor="start">tile footprint</text>
<text x="450.0" y="385.0" class="s" text-anchor="start">Trade-off: big blocks → few requests, but most of each block is unused at high zoom.</text>
</svg>