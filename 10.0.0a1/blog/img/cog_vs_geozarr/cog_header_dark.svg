<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 250" width="1000" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="COG: read the header">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d;
          --cog:#4a8cf0; --cog-soft:#1c2c4d; --zarr:#e06a30; --zarr-soft:#4a2516;
          --cog-o:#27406a; --zarr-o:#633420; }
  text { white-space:pre; }
  .bg { fill:none; } .panel { fill:var(--panel); stroke:var(--line); }
  .t { fill:var(--fg); font-size:13px; } .s { fill:var(--muted); font-size:11.5px; }
  .xs { fill:var(--muted); font-size:10.5px; }
  .h1 { fill:var(--fg); font-size:20px; font-weight:600; }
  .h2c { fill:var(--cog); font-size:16px; font-weight:600; }
  .h2z { fill:var(--zarr); font-size:16px; font-weight:600; }
  .b { fill:var(--fg); font-size:13px; font-weight:600; }
  .bc { fill:var(--cog); font-size:13px; font-weight:600; }
  .bz { fill:var(--zarr); font-size:13px; font-weight:600; }
  .mono { fill:var(--fg); font-size:11.5px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .monos { fill:var(--muted); font-size:10.5px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .onc { fill:#ffffff; font-size:12px; font-weight:600; }
  .ln { stroke:var(--line); stroke-width:1; fill:none; }
  .axis { stroke:var(--line); stroke-width:1; fill:none; }
  .dash { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; fill:none; }
  .life { stroke:var(--line); stroke-width:2; fill:none; }
  .cogS { fill:var(--cog); } .cogF { fill:var(--cog-soft); stroke:var(--cog); stroke-width:1; }
  .cogG { stroke:var(--cog); stroke-width:0.6; opacity:.7; }
  .cogO { fill:var(--cog-o); }
  .zarS { fill:var(--zarr); } .zarF { fill:var(--zarr-soft); stroke:var(--zarr); stroke-width:1; }
  .zarG { stroke:var(--zarr); stroke-width:0.5; opacity:.6; }
  .zarO { fill:var(--zarr-o); }
  .fpc { fill:none; stroke:var(--fg); stroke-width:1.6; }
  .box { fill:var(--bg); stroke:var(--line); }
  .gray { fill:var(--muted); } .grayO { fill:var(--muted); opacity:.4; }
  .hc { paint-order:stroke; stroke:var(--cog-soft); stroke-width:5px; stroke-linejoin:round; }
  .hp { paint-order:stroke; stroke:var(--panel); stroke-width:5px; stroke-linejoin:round; }
  .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#am); }
  .arr-c { stroke:var(--cog); stroke-width:1.5; fill:none; marker-end:url(#ac); }
  .arr-z { stroke:var(--zarr); stroke-width:1.5; fill:none; marker-end:url(#az); }
  .arr-cd { stroke:var(--cog); stroke-width:1.5; fill:none; stroke-dasharray:5 3; marker-end:url(#ac); }
  .arr-zd { stroke:var(--zarr); stroke-width:1.5; fill:none; stroke-dasharray:5 3; marker-end:url(#az); }
</style>
<defs>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--cog)"/></marker>
  <marker id="az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--zarr)"/></marker>
</defs>
<rect x="0.0" y="0.0" width="1000.0" height="250.0" rx="0" class="bg"></rect>
<rect x="40.0" y="80.0" width="130.0" height="50.0" rx="0" class="cogS"></rect>
<rect x="170.0" y="80.0" width="160.0" height="50.0" rx="0" class="cogF"></rect>
<rect x="330.0" y="80.0" width="630.0" height="50.0" rx="0" class="cogF"></rect>
<line x1="387.3" y1="80.0" x2="387.3" y2="130.0" class="cogG"/>
<line x1="444.5" y1="80.0" x2="444.5" y2="130.0" class="cogG"/>
<line x1="501.8" y1="80.0" x2="501.8" y2="130.0" class="cogG"/>
<line x1="559.1" y1="80.0" x2="559.1" y2="130.0" class="cogG"/>
<line x1="616.4" y1="80.0" x2="616.4" y2="130.0" class="cogG"/>
<line x1="673.6" y1="80.0" x2="673.6" y2="130.0" class="cogG"/>
<line x1="730.9" y1="80.0" x2="730.9" y2="130.0" class="cogG"/>
<line x1="788.2" y1="80.0" x2="788.2" y2="130.0" class="cogG"/>
<line x1="845.5" y1="80.0" x2="845.5" y2="130.0" class="cogG"/>
<line x1="902.7" y1="80.0" x2="902.7" y2="130.0" class="cogG"/>
<line x1="210.0" y1="80.0" x2="210.0" y2="130.0" class="cogG"/>
<line x1="250.0" y1="80.0" x2="250.0" y2="130.0" class="cogG"/>
<line x1="290.0" y1="80.0" x2="290.0" y2="130.0" class="cogG"/>
<text x="105.0" y="104.0" class="onc" text-anchor="middle">HEADER</text>
<text x="105.0" y="119.0" class="onc" text-anchor="middle">IFDs + offsets</text>
<text x="250.0" y="102.0" class="t hc" text-anchor="middle">overviews</text>
<text x="250.0" y="118.0" class="xs hc" text-anchor="middle">×16 … ×2, small</text>
<text x="645.0" y="102.0" class="t hc" text-anchor="middle">full-resolution blocks (11 × 11)</text>
<text x="645.0" y="118.0" class="xs hc" text-anchor="middle">1024×1024 uint16, DEFLATE</text>
<text x="40.0" y="146.0" class="monos" text-anchor="middle">0</text>
<text x="170.0" y="146.0" class="monos" text-anchor="middle">32 KB</text>
<text x="330.0" y="146.0" class="monos" text-anchor="middle">~54 MB</text>
<text x="960.0" y="146.0" class="monos" text-anchor="middle">212 MB</text>
<text x="40.0" y="28.0" class="bc" text-anchor="start">① GET bytes=0-32767</text>
<text x="40.0" y="46.0" class="s" text-anchor="start">1 request</text>
<path d="M60,52 L60,77" class="arr-c"/>
<path d="M140,78 C140,46 640,46 640,77" class="arr-c"/>
<path d="M140,78 C140,58 250,58 250,77" class="arr-c"/>
<text x="420.0" y="40.0" class="s" text-anchor="middle">the header holds the byte offset of every block, of every level</text>
<text x="40.0" y="182.0" class="mono" text-anchor="start">TileOffsets[]    = [ 3562, 378214, … , 142834054, … ]</text>
<text x="40.0" y="202.0" class="mono" text-anchor="start">TileByteCounts[] = [ 374652, … , 1567374, … ]</text>
<text x="40.0" y="234.0" class="s" text-anchor="start">After this single request the reader knows the exact byte range of any block — no more metadata requests.</text>
<text x="960.0" y="234.0" class="xs" text-anchor="end">byte layout, not to scale</text>
</svg>